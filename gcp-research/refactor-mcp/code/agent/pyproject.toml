###############################################################################
# tiktok-orchestrator — Python ADK orchestration layer for the Social Seeding
# Influencer Research Agent.
#
# Decisions implemented:
#   - D1   Dual submission (Track 3 reference path)
#   - D3   KR-gap framed as A2A-only distribution innovation
#   - D17  Vertex AI Agent Runtime as the deployment target (Cloud Run for now;
#          Agent Runtime once Track 3 Path A is ready for migration)
#   - D19  Identity Platform replaces SQLite OAuth
#   - D21  Model Armor max-policy sanitization on every model call
#
# Build & run locally:
#   cd code/agent
#   uv pip install --system -e .
#   uvicorn tiktok_orchestrator.main:app --reload --port 8200
#
# Pinning policy:
#   - google-adk + google-cloud-aiplatform: pin to known-good 2026-05 minors
#     (see REFACTOR-MCP §3.3). Open upper bounds avoid breakage on the
#     0.x ADK release train.
#   - firebase-admin: pinned to current GA shape (>=7.x) — see D19.
#   - google-cloud-modelarmor: pinned to current GA shape — see D21 +
#     ARMOR-GATEWAY.md §1.6 (per-request sanitization path).
###############################################################################

[project]
name = "tiktok-orchestrator"
version = "1.0.0"
description = "ADK orchestration layer wrapping the tiktok-mcp-server MCP tools as an A2A-listable Influencer Research Agent for Gemini Enterprise."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Social Seeding", email = "support@socialseed.ing" }]
# License rationale: ancillary code per DECISIONS.md D9 (BUSL-1.1 core +
# Apache-2.0 ancillary). The package-level LICENSE is at the package root
# (gcp-research/refactor-mcp/code/LICENSE).

dependencies = [
    # --- ADK + Vertex AI -----------------------------------------------------
    "google-adk>=1.0.0,<2.0.0",                  # ADK 1.x Beta (D17)
    "google-cloud-aiplatform>=1.85.0,<2.0.0",    # Vertex SDK with Gemini 2.5
    "google-genai>=1.20.0,<2.0.0",               # Unified GenAI Python SDK
    # --- Identity Platform (D19) ---------------------------------------------
    "firebase-admin>=7.0.0,<8.0.0",              # verify_id_token for ID Platform
    "google-auth>=2.40.0,<3.0.0",
    # --- Agent-card JWS signing (A2A v0.3 signatures[]) ----------------------
    "cryptography>=43.0.0,<49.0.0",              # ES256 sign/verify for card_signer (RFC 7515)
    # --- Model Armor (D21) ---------------------------------------------------
    "google-cloud-modelarmor>=0.3.0,<1.0.0",     # sanitizeUserPrompt + sanitizeModelResponse
    # --- HTTP server ---------------------------------------------------------
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",                      # async MCP client
    "pydantic>=2.9.0,<3.0.0",
    # --- Telemetry / observability ------------------------------------------
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    "structlog>=24.4.0,<25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-httpx>=0.30.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "types-requests>=2.32.0",
]

[project.scripts]
tiktok-orchestrator = "tiktok_orchestrator.main:run"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_orchestrator"]

# --- Tooling -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: requires live MCP server (set MCP_BASE_URL)",
    "vertex: requires Vertex AI credentials (set GOOGLE_APPLICATION_CREDENTIALS)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
