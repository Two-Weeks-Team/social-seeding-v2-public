###############################################################################
# Cloud Build pipeline for the tiktok-mcp-server refactor.
#
# Triggered by: GitHub push to the `gemini-enterprise` branch of the platform
# repo (`microservices/tiktok-mcp-server/**`) AND of the refactor repo
# (`gcp-research/refactor-mcp/code/agent/**`).
#
# Output:
#   - $LOCATION-docker.pkg.dev/$PROJECT_ID/socialseed-mcp/mcp-node:$SHORT_SHA
#   - $LOCATION-docker.pkg.dev/$PROJECT_ID/socialseed-mcp/mcp-adk:$SHORT_SHA
#   - Cloud Run service `tiktok-mcp` updated to the new revision.
#
# Reference: REFACTOR-MCP.md §5.1.
#
# Substitutions (configure on the trigger):
#   _LOCATION: us-central1
#   _SERVICE:  tiktok-mcp
#   _REPO:     socialseed-mcp
#
# Required IAM (on the Cloud Build service account):
#   - roles/run.developer        (deploy to Cloud Run)
#   - roles/iam.serviceAccountUser
#   - roles/artifactregistry.writer
#   - roles/cloudkms.cryptoKeyEncrypterDecrypter  (CMEK on AR, per D20)
###############################################################################

steps:
  # ---------------------------------------------------------------------------
  # 1. Build the Node MCP server image (sidecar).
  # ---------------------------------------------------------------------------
  - id: build-mcp-node
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runtime-node
      - --tag=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-node:$SHORT_SHA
      - --tag=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-node:latest
      - --file=deployment/Dockerfile.multi-container
      - .

  # ---------------------------------------------------------------------------
  # 2. Build the Python ADK agent image (primary ingress).
  # ---------------------------------------------------------------------------
  - id: build-mcp-adk
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runtime-adk
      - --tag=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-adk:$SHORT_SHA
      - --tag=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-adk:latest
      - --file=deployment/Dockerfile.multi-container
      - .

  # ---------------------------------------------------------------------------
  # 3. Push both images to Artifact Registry.
  # ---------------------------------------------------------------------------
  - id: push-mcp-node
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-mcp-node"]
    args:
      - push
      - --all-tags
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-node

  - id: push-mcp-adk
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-mcp-adk"]
    args:
      - push
      - --all-tags
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-adk

  # ---------------------------------------------------------------------------
  # 4. Scan both images for CVEs before promoting (Phase 5 §5.4 checklist).
  # ---------------------------------------------------------------------------
  - id: scan-mcp-node
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: ["push-mcp-node"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud artifacts docker images scan \
          ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-node:$SHORT_SHA \
          --location=${_LOCATION} \
          --format='value(response.scan)' > /workspace/scan-node.txt
        echo "Scan ref:" "$(cat /workspace/scan-node.txt)"

  - id: scan-mcp-adk
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: ["push-mcp-adk"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud artifacts docker images scan \
          ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-adk:$SHORT_SHA \
          --location=${_LOCATION} \
          --format='value(response.scan)' > /workspace/scan-adk.txt
        echo "Scan ref:" "$(cat /workspace/scan-adk.txt)"

  # ---------------------------------------------------------------------------
  # 5. Render the Cloud Run service manifest with the new digest, then apply.
  #    We use `gcloud run services replace` so the YAML is the source of truth
  #    (REFACTOR-MCP §5.3).
  # ---------------------------------------------------------------------------
  - id: render-and-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: ["scan-mcp-node", "scan-mcp-adk"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        sed \
          -e "s|__PROJECT__|$PROJECT_ID|g" \
          -e "s|__LOCATION__|${_LOCATION}|g" \
          -e "s|__REPO__|${_REPO}|g" \
          -e "s|__SHA__|$SHORT_SHA|g" \
          deployment/cloud-run-service.yaml > /workspace/service.rendered.yaml
        cat /workspace/service.rendered.yaml
        gcloud run services replace /workspace/service.rendered.yaml \
          --region=${_LOCATION} \
          --quiet

  # ---------------------------------------------------------------------------
  # 6. Run smoke test against the new revision before routing 100% traffic.
  #    (Cloud Run traffic split is configured on the service itself; this
  #    step just verifies the revision is healthy before declaring success.)
  # ---------------------------------------------------------------------------
  - id: smoke-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: ["render-and-deploy"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URL=$$(gcloud run services describe ${_SERVICE} \
          --region=${_LOCATION} --format='value(status.url)')
        echo "Service URL: $$URL"
        for i in 1 2 3 4 5; do
          if curl -fsS "$$URL/healthz" -o /dev/null; then
            echo "healthz OK (attempt $$i)"
            curl -fsS "$$URL/.well-known/agent.json" -o /workspace/agent-card.json
            jq -e '.skills[0].id == "plan_creator_search"' /workspace/agent-card.json
            exit 0
          fi
          sleep 5
        done
        echo "Smoke test failed after 5 attempts" >&2
        exit 1

# -----------------------------------------------------------------------------
# Build options
# -----------------------------------------------------------------------------

images:
  - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-node:$SHORT_SHA
  - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-node:latest
  - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-adk:$SHORT_SHA
  - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-adk:latest

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  # Limit log retention so we don't accumulate build chatter forever.
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  machineType: E2_HIGHCPU_8

timeout: 1800s

substitutions:
  _LOCATION: us-central1
  _SERVICE: tiktok-mcp
  _REPO: socialseed-mcp
