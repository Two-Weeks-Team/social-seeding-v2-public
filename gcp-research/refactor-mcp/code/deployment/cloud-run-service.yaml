###############################################################################
# Cloud Run service spec — multi-container (ADK agent + Node MCP sidecar).
#
# Applied by `gcloud run services replace` from the cloudbuild.yaml pipeline.
# Token substitutions (`__PROJECT__`, `__LOCATION__`, `__REPO__`, `__SHA__`)
# are filled in at deploy time so we never check in the project id.
#
# Reference: REFACTOR-MCP.md §5.3.
#
# Notes:
#   * sessionAffinity:"true" addresses REFACTOR-MCP §9.5 — the MCP transport
#     keeps an in-memory Map<sessionId,{server,transport}> so consecutive
#     requests in a session MUST land on the same instance.
#   * Only the ADK container exposes a port (8200). The Node container
#     listens on 127.0.0.1:8100 (loopback) and is not externally reachable.
#   * Resource requests are conservative for Track 3 demo traffic; tune the
#     min/maxScale + CPU for production after seeing real load.
###############################################################################

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ss-mcp-server
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all
    run.googleapis.com/description: >
      SocialSeeding Influencer Research Agent — ADK orchestration + tiktok-mcp
      sidecar (multi-container Cloud Run).
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/sessionAffinity: "true"
        autoscaling.knative.dev/minScale: "1"      # warm one instance for the demo window
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cmek-key-name: >-
          projects/__PROJECT__/locations/__LOCATION__/keyRings/socialseed-mcp/cryptoKeys/cloud-run
        # Per Track 3 Phase 5 §5.4 Enterprise Standards — secrets via Secret
        # Manager only; no `ENV` injection in the manifest.
    spec:
      serviceAccountName: tiktok-mcp-runner@__PROJECT__.iam.gserviceaccount.com
      # The heuristic ranker drives many sequential live MCP calls (search →
      # user_info → user_posts → post_detail across the top candidates), which
      # exceeds 60s with real scraping. 300s lets a cold real-data request
      # finish; the demo workflow can also call async.
      timeoutSeconds: 300
      containerConcurrency: 30
      containers:
        # ---------------------------------------------------------------------
        # Container A — ADK orchestration agent (Python). Primary ingress.
        # ---------------------------------------------------------------------
        - name: agent
          image: __LOCATION__-docker.pkg.dev/__PROJECT__/__REPO__/mcp-adk:__SHA__
          ports:
            - name: http1
              containerPort: 8200
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "__PROJECT__"
            # ADK ranker LIVE: Gemini 3.x is served on the Vertex `global`
            # endpoint (hardcoded, NOT the regional __LOCATION__ used for the AR
            # image refs). Model Armor stays regional via MODEL_ARMOR_LOCATION.
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: MCP_BASE_URL
              value: "http://127.0.0.1:8100"
            - name: PUBLIC_BASE_URL
              value: "https://mcp.socialseed.ing"
            # Production posture: REQUIRE_AUTH=true — verify caller OIDC/OAuth
            # per request (matches the code default in
            # agent/src/tiktok_orchestrator/main.py). The Track-3 OPEN DEMO image
            # ships REQUIRE_AUTH=false (Dockerfile) for unauthenticated A2A
            # reachability; transport-layer mTLS enforcement is pending O7
            # (Agent Gateway Private-Preview allowlist). Single source of truth
            # for the demo-vs-prod posture: deployment/agent.json
            # `x-securityPosture` (DECISIONS.md D44 Agent Gateway/Identity, D7).
            - name: REQUIRE_AUTH
              value: "true"
            - name: IDENTITY_PLATFORM_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: identity-platform-tenant-id
                  key: latest
            # A2A v0.3 agent-card signing key (JWS ES256), held in Cloud KMS
            # (asymmetric EC_SIGN_P256_SHA256). The private key never leaves KMS:
            # the agent signs the card via cryptoKeyVersions.asymmetricSign and
            # publishes every enabled version's public key at
            # /.well-known/jwks.json (kid = <prefix>-v<N>). This replaces the
            # prior Secret-Manager PEM key (agent-card-signing-key) — prod key
            # custody + manual rotation (KMS does not auto-rotate asymmetric
            # keys; see deployment/KMS-CARD-SIGNING.md). Runtime SA
            # tiktok-mcp-runner@ holds roles/cloudkms.signerVerifier + viewer on
            # the key. No pinned version → the latest ENABLED version signs, so a
            # rotation is just "create version + redeploy".
            - name: AGENT_CARD_SIGNING_KMS_KEY
              value: >-
                projects/__PROJECT__/locations/us-central1/keyRings/socialseed-mcp/cryptoKeys/agent-card-signing
            - name: AGENT_CARD_SIGNING_KID
              value: "ss-agent-card-prod"
            # Model Armor templates are PINNED to us-central1 (where they were
            # provisioned), independent of GOOGLE_CLOUD_LOCATION — see
            # MODEL_ARMOR_LOCATION below + the decouple note on the ADK block.
            - name: MODEL_ARMOR_INPUT_TEMPLATE
              value: >-
                projects/__PROJECT__/locations/us-central1/templates/ss-input
            - name: MODEL_ARMOR_OUTPUT_TEMPLATE
              value: >-
                projects/__PROJECT__/locations/us-central1/templates/ss-output
            - name: MODEL_ARMOR_FAIL_MODE
              value: "closed"
            # Model Armor LIVE (D21) — ss-input/ss-output provisioned in
            # ss-mcp-prod/us-central1. The regional API endpoint + templates are
            # driven by MODEL_ARMOR_LOCATION (NOT GOOGLE_CLOUD_LOCATION), so the
            # ADK ranker can use the Vertex `global` endpoint without breaking
            # Model Armor (model_armor.py REGION = MODEL_ARMOR_LOCATION).
            - name: MODEL_ARMOR_LOCATION
              value: "us-central1"
            - name: MODEL_ARMOR_MODE
              value: "live"
            # Ranker is LIVE on the ADK path (real Gemini 3.x ranking on Vertex
            # `global`): ADK_DISABLED="0". Verified via a no-traffic canary
            # (rev 00008-ndg, 2026-05-23) before traffic cut — Model Armor still
            # blocked a jailbreak, no-token=401, and plan_creator_search returned
            # real ADK-ranked creators (engagement>0, semantic fit_score). The
            # `_heuristic_rank` path remains the in-code fallback when ADK is
            # unavailable. Prereq runtime SA role roles/aiplatform.user is
            # already granted on tiktok-mcp-runner@ss-mcp-prod.
            - name: ADK_DISABLED
              value: "0"
            # S2S auth (D44): in addition to Firebase, accept the internal
            # caller's Google service-identity OIDC token. Caller = ss-agents
            # runtime SA; audiences = every URL the caller may POST to.
            - name: ALLOWED_CALLER_SERVICE_ACCOUNTS
              value: "ss-agents-runtime@ss-v2-prod.iam.gserviceaccount.com"
            - name: SERVICE_IDENTITY_AUDIENCES
              value: "https://ss-mcp-server-1049119860518.us-central1.run.app,https://ss-mcp-server-s2le2ic2eq-uc.a.run.app,https://mcp.socialseed.ing"
            # D53: searcher = bulk tier, ranker = judgment tier. The only two
            # callable product ids; gemini-*-pro is 404. The ADK path calls
            # these on the Vertex `global` endpoint, so the ADK-on procedure
            # (above) sets GOOGLE_CLOUD_LOCATION=global. The Model-Armor region
            # is now DECOUPLED (MODEL_ARMOR_LOCATION), so global no longer
            # conflicts with the regional Model-Armor endpoint/templates.
            - name: ADK_FLASH_MODEL
              value: "gemini-3.1-flash-lite"
            - name: ADK_PRO_MODEL
              value: "gemini-3.5-flash"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8200
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8200
            periodSeconds: 30
            timeoutSeconds: 5
        # ---------------------------------------------------------------------
        # Container B — Node MCP sidecar (existing tiktok-mcp-server, 4 tools).
        # ---------------------------------------------------------------------
        - name: mcp
          image: __LOCATION__-docker.pkg.dev/__PROJECT__/__REPO__/mcp-node:__SHA__
          env:
            - name: MCP_HOST
              value: "127.0.0.1"
            - name: MCP_PORT
              value: "8100"
            - name: MCP_RESOURCE
              value: "https://mcp.socialseed.ing"
            - name: BACKEND_URL
              value: "https://backend.socialseed.ing"
            - name: BACKEND_DASHBOARD_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-dashboard-email
                  key: latest
            - name: BACKEND_DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-dashboard-password
                  key: latest
            # OBS-03 (existing Dockerfile line 41-46): SENTRY_DSN only at
            # runtime, never baked into the image.
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sentry-dsn
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
          # No public port → no liveness probe target; Cloud Run will restart
          # the entire pod if the primary container is unhealthy.
  traffic:
    - latestRevision: true
      percent: 100
