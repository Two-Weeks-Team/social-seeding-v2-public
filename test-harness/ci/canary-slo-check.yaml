# canary-slo-check.yaml — Cloud Deploy verify-step container.
# Cites: D37, ARCHITECTURE.md §7 (Cloud Deploy canary). MATRIX §7.3.
# chaos/SCENARIOS.md §7.2 per-deploy gate.
#
# This Cloud Build YAML compiles the verify-step image used by Cloud Deploy
# during the 10% canary window:
#   Cloud Build green → Cloud Deploy canary 10% → 5-min SLO check → 100% prod
#
# The image runs:
#   1. SLO burn-rate check (Cloud Monitoring slo-burn alerts)
#   2. The 4 SLO-direct chaos scenarios (CHAOS-EDGE-01, CHAOS-COMP-01,
#      CHAOS-MODEL-01, CHAOS-DATA-01)
#   3. L1 full evalset on the canary endpoint
#
# Auto-rollback: if burn rate > 2× baseline, Cloud Deploy rolls back per
# clouddeploy.yaml. https://cloud.google.com/monitoring/alerts/slo-burn-rate-alerts

steps:
  # ------------------------------------------------------------------ Build
  - id: build-verify-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "us-docker.pkg.dev/ss-v2/chaos/canary-verify:${SHORT_SHA}"
      - -f
      - "test-harness/ci/Dockerfile.canary-verify"   # TODO: ship Dockerfile (MATRIX §11 C3)
      - "test-harness/"

  # ------------------------------------------------------------------ Push
  - id: push-verify-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "us-docker.pkg.dev/ss-v2/chaos/canary-verify:${SHORT_SHA}"
    waitFor: ["build-verify-image"]

  # ------------------------------------------------------------------ Sanity check (per chaos/SCENARIOS.md §7.2)
  - id: canary-chaos-sanity
    name: python:3.13-slim
    waitFor: ["push-verify-image"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install pyyaml
        # Run the 4 SLO-direct scenarios with HARNESS_MODE=stub for the
        # smoke; the actual canary-time check runs in HARNESS_MODE=live
        # against the canary endpoint.
        for sid in global-lb-region-eject agent-runtime-cold-start vertex-429 spanner-failover; do
          HARNESS_MODE=stub python3 test-harness/chaos/orchestrator.py \
            --scenario test-harness/chaos/scenarios/${sid}.yaml
        done

# Per ARCHITECTURE.md §7: 5-min SLO burn-rate window is the canary phase budget.
timeout: 600s

substitutions:
  _SHORT_SHA: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
