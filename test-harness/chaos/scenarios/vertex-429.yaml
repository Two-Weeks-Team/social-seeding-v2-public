# CHAOS-MODEL-01 — Vertex AI 429 quota exhaustion
# Cites: D17 (Agent Runtime), D31, D32, D37
# Source: chaos/SCENARIOS.md §3.6 CHAOS-MODEL-01
# Tags: per_pr (fast 10), nightly

id: CHAOS-MODEL-01
name: vertex-429-quota
tier: model
executor: native_gcp
tags: [per_pr, nightly, canary]

description: |
  Hit per-region Gemini 3.5 Flash quota during a vetting fan-out. Validates
  fallback to Flash with eval-score tolerance, exponential backoff, and
  circuit-breaker open on 5 consecutive 429s.

trigger:
  type: synthetic_load
  config:
    target_model: gemini-3.5-flash
    target_region: us-central1
    request_rate_rpm: 1500    # well above prod quota (300/min default)
    duration_min: 5
  alternative:
    type: quota_lower
    command: |
      gcloud quotas update --region=us-central1 \
        --service=aiplatform.googleapis.com \
        --quota=GenerateContentRequestsPerMinutePerProject \
        --value=10 \
        --project=ss-v2-chaos

expected_rto_s: 300  # degraded throughput; not an outage
expected_rpo_s: 0
observed_sli_breach: vertex.gemini.errors.429

auto_runbook: runbook-model-fallback
auto_runbook_timeout_s: 60
auto_runbook_behaviors:
  - "switch affected agent's default from Pro → Flash for 15 min"
  - "queue backed-off requests on Cloud Tasks"
  - "open circuit breaker after 5 consecutive 429s"

recovery_validation:
  type: eval
  steps:
    - "run vetting agent eval on Flash"
    - "expect eval_score >= 0.85 × pro_baseline"

pass_criteria:
  - "no campaign halted"
  - "agent eval on Flash within tolerance"
  - "auto-recovery from fallback when 429s clear"

stub_override:
  pass: true

references:
  - "https://cloud.google.com/vertex-ai/generative-ai/docs/quotas"
