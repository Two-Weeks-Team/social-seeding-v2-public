[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ss-agents-acli"
version = "0.1.0"
description = "Google Agents CLI project wrapping Social Seeding v2's real ss-agents fleet (campaign orchestrator + Google Search grounding)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "BUSL-1.1" }
authors = [{ name = "Social Seeding", email = "app.2weeks@gmail.com" }]
keywords = ["agents-cli", "adk", "vertex-ai", "gemini", "grounding", "social-seeding"]

# Citations (DECISIONS.md):
#   D41 — Capability layer ADK FunctionTool stub/live pattern (we wrap ss_agents tools).
#   D45 — coordinator → a2a_invoke → ss-mcp-server.plan_creator_search (cross-component proof).
#   D47 — Google Agents Challenge submission surface (agents-cli playground/eval/deploy).
#   D53 — Google Search grounding via gemini-3.5-flash on the Vertex `global` endpoint.
#
# Models: Gemini 3.x ONLY. `gemini-3.5-flash` for judgment/orchestration, served on
# the Vertex `global` endpoint. No 2.5, no Claude, no *-pro.
dependencies = [
  # ADK 1.x stable — what agents-cli `create --adk` and the Cloud Run / Agent
  # Engine quickstarts target (matches ../packages/agents-adk pin).
  "google-adk>=1.3,<2",
  "google-genai>=1.0",
  "google-cloud-aiplatform>=1.95",
  # Reuse the REAL Social Seeding agent fleet (web_search grounding, a2a_invoke,
  # rapidapi_tiktok_search, …). Resolved to an editable local path via
  # [tool.uv.sources] below — the single source of truth, NOT a copy.
  "ss-agents-adk",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
]
# `agents-cli eval run` syncs this extra (uv sync --dev --extra eval).
eval = [
  "google-adk[eval]>=1.3,<2",
]

[tool.uv.sources]
# Editable install so edits to ../packages/agents-adk/src are picked up live and
# we never vendor a stale copy of the agent logic (which we are forbidden to fork).
ss-agents-adk = { path = "../packages/agents-adk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that hit live Vertex AI / agents-cli (skip by default).",
]
filterwarnings = [
  "ignore::DeprecationWarning:google.*",
  "ignore::DeprecationWarning:pydantic.*",
]
