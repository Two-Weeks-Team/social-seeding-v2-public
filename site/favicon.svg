<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Social Seeding v2 — 22-agent fleet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 22-dot fleet arranged as 4 + 5 + 4 + 5 + 4 rows -->
  <g fill="#ffffff" opacity="0.95">
    <!-- row 1: 4 dots -->
    <circle cx="20" cy="14" r="2.4"/>
    <circle cx="28" cy="14" r="2.4"/>
    <circle cx="36" cy="14" r="2.4"/>
    <circle cx="44" cy="14" r="2.4"/>
    <!-- row 2: 5 dots -->
    <circle cx="16" cy="24" r="2.4"/>
    <circle cx="24" cy="24" r="2.4"/>
    <circle cx="32" cy="24" r="2.4"/>
    <circle cx="40" cy="24" r="2.4"/>
    <circle cx="48" cy="24" r="2.4"/>
    <!-- row 3: 4 dots -->
    <circle cx="20" cy="34" r="2.4"/>
    <circle cx="28" cy="34" r="2.4"/>
    <circle cx="36" cy="34" r="2.4"/>
    <circle cx="44" cy="34" r="2.4"/>
    <!-- row 4: 5 dots -->
    <circle cx="16" cy="44" r="2.4"/>
    <circle cx="24" cy="44" r="2.4"/>
    <circle cx="32" cy="44" r="2.4"/>
    <circle cx="40" cy="44" r="2.4"/>
    <circle cx="48" cy="44" r="2.4"/>
    <!-- row 5: 4 dots -->
    <circle cx="20" cy="54" r="2.4"/>
    <circle cx="28" cy="54" r="2.4"/>
    <circle cx="36" cy="54" r="2.4"/>
    <circle cx="44" cy="54" r="2.4"/>
  </g>
</svg>
