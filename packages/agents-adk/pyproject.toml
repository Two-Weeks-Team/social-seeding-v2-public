[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ss-agents-adk"
version = "0.1.0"
description = "social-seeding-v2 ADK Python agents (Phase 2 scaffold)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "BUSL-1.1" }
authors = [{ name = "Social Seeding", email = "app.2weeks@gmail.com" }]
keywords = ["adk", "vertex-ai", "gemini", "agents", "social-seeding"]

# Citations:
#   D5  — Gemini 3.1 family production baseline
#   D17 — Vertex AI Agent Runtime
#   D35 — Hybrid codebase strategy (this package is the "rebuild from zero" half)
#   D36 — SDD via JSON Schema (we mirror the schemas as Pydantic models here)
#   D37 — TDD pyramid layer 3 (pytest + Hypothesis property tests)
#
# We pin to ADK 1.x stable per ADK-GUIDE.md §1.1:
#   "1.x stable" is what Cloud Run / Agent Engine quickstarts target, and the
#   2.0 Beta workflow graph runtime is breaking and pre-release. Phase 2 ships
#   on 1.x; Phase 3+ may opt-in to `--pre` for fan-out/gather graphs.
dependencies = [
  "google-adk>=1.3,<2",
  "google-cloud-aiplatform>=1.95",
  "google-genai>=1.0",
  "google-cloud-firestore>=2.20",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5",
  # Observability — D31 (Enterprise SLO) + D32 (Cloud Monitoring + Chronicle)
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",
  # HTTP client for capability stubs
  "httpx>=0.27",
  # Structured logging
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "pytest-cov>=5.0",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ss_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: tests that hit live Vertex AI (skip by default; set SS_LIVE=1 to enable)",
  "slow: tests >2s",
]
filterwarnings = [
  "ignore::DeprecationWarning:google.*",
  "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]  # line length covered by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
