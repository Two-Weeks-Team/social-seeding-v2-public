# brand-campaign.workflows.yaml
# Source: INNGEST-MIGRATION.md §4.1 (deploy-ready; verbatim port).
# Mirrors packages/workflows/src/workflows/brand-campaign.ts under D18.
# Trigger: Eventarc subscription on Pub/Sub topic "campaign.submitted".
# Cancellation: Pub/Sub "campaign.cancelled" → cancel-on-event Cloud Run service.
#
# Agent endpoint resolution (D42):
#   Agent runtime URLs are NOT hardcoded. The workflow reads each per-agent URL
#   via `${default(map.get(args.agent_urls, "<id>"), sys.get_env("AGENT_URL_<ID>"))}`.
#   This honors D42 in two layered ways:
#     1. Runtime injection: callers that own the args payload (manual `gcloud
#        workflows execute`, Cloud Scheduler with augmented JSON) pass
#        `agent_urls` keyed by agent_id; Terraform `output -json
#        ai_module.agent_urls` is the source of truth per environment.
#     2. Env-var fallback: Eventarc/Pub/Sub-triggered runs receive only the
#        CloudEvent body as args and cannot easily inject a map, so each
#        agent URL is also exposed as user_env_var `AGENT_URL_<UPPER>` (set
#        by terraform/modules/integration/workflows.tf from the same
#        `agent_urls` map). `default()` selects whichever is present.
#   No hardcoded `https://…` literals remain in this YAML (D42 anchor).
#
# Multi-agent orchestration + A2A cross-call (G1 / D23 / D24 / D45):
#   `coordinate_sourcing` asks the coordinator agent (M1) which agent should
#   source creators — a LOCAL in-process `sourcing` agent or the REMOTE A2A
#   `tiktok-mcp-search` node (the OSS tiktok-mcp-server). `branch_on_route`
#   then performs the transport switch the coordinator's contract delegates to
#   the workflow; the remote branch (`a2a_invoke_remote`) issues an A2A v0.3
#   `message:send` to tiktok-mcp-server's `plan_creator_search` intent
#   (A2A-INTENTS.md §2.1). Both routes converge on the same `candidates`
#   variable, so `vetting_fanout` and everything downstream is unchanged.
#   The coordinator URL resolves via `AGENT_URL_COORDINATOR` and the remote
#   node via `AGENT_URL_TIKTOK_MCP` — same D42 env-var/args mechanism, still
#   zero hardcoded hostnames.

main:
  params: [args]
  steps:
    - init:
        assign:
          - campaignId: ${args.campaignId}
          - brief: ${args.brief}
          - workspaceId: ${brief.workspaceId}
          - vetted: []
          - confirmed: []
          - shortlist: []

    - observability_init:
        call: http.post
        args:
          url: ${sys.get_env("OBSERVABILITY_URL") + "/runs"}
          body:
            campaignId: ${campaignId}
            workflow: "brand-campaign"
          auth:
            type: OIDC
        retry: ${http.default_retry}

    - load_policy:
        call: http.post
        args:
          url: ${sys.get_env("POLICY_URL") + "/get"}
          body:
            workspaceId: ${workspaceId}
          auth:
            type: OIDC
        result: policy_response
    - assign_policy:
        assign:
          - policy: ${policy_response.body}

    # ── A2A wiring (G1) ──────────────────────────────────────────────────────
    # D23: the coordinator (M1) is the workflow's "lead picker" — the workflow
    #   does NOT hard-wire which agent sources creators; it ASKS the coordinator.
    # D24: phased coordination — the candidate pool offers BOTH a local in-process
    #   `sourcing` agent (0→1) and a remote A2A `tiktok-mcp-search` node (1→100).
    # D45: when the coordinator routes to the remote node, the workflow performs
    #   the actual transport switch and A2A-invokes the OSS tiktok-mcp-server —
    #   the load-bearing cross-component edge for the single-Track-3 narrative.
    # Per coordinator.py: "Cloud Workflows performs the actual transport switch
    #   after the routing decision lands" — the workflow, NOT the agent, A2A-POSTs.
    - coordinate_sourcing:
        call: http.post
        args:
          # D42: agent URL resolved via args.agent_urls map OR AGENT_URL_<ID>
          # env-var fallback — never a hardcoded https:// literal.
          url: ${default(map.get(args.agent_urls, "coordinator"), sys.get_env("AGENT_URL_COORDINATOR"))}
          body:
            # CoordinatorInput (coordinator.py): taskDescription + workspacePolicy
            # + candidateAgents pool. The brief text drives the routing decision.
            taskDescription: ${"Source creators for brand campaign " + campaignId + " — targeting " + json.encode(brief.targeting)}
            workspacePolicy:
              # Empty allowedAgents = all candidates allowed; budget/SLA advisory.
              allowedAgents: []
              budgetRemainingUsd: ${policy.budgets.maxUsdPerCampaign}
              slaTargetMs: 4000
            candidateAgents:
              # D24: local in-process sourcing agent (0→1 phase).
              - agentId: "sourcing"
                capabilities: ["source_creators", "tiktok", "rapidapi"]
                avgLatencyMs: 2400
                avgCostUsd: 0.018
                transport: "in_process"
              # D24/D45: remote A2A node — the OSS tiktok-mcp-server (1→100 phase).
              - agentId: "tiktok-mcp-search"
                capabilities: ["source_creators", "tiktok", "remote", "a2a"]
                avgLatencyMs: 3100
                avgCostUsd: 0.012
                transport: "a2a_grpc"
            locale: "en"
            allowRemote: true
            preferLocal: true
          auth:
            type: OIDC
          timeout: 30
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 3
          backoff: {initial_delay: 2, max_delay: 30, multiplier: 2}
        result: coordinator_response

    # D24/D45: branch on the coordinator's routing decision. If it picked the
    # remote A2A node, perform the transport switch (a2a_invoke_remote). The
    # __escalate__ sentinel (coordinator.py ESCALATE_AGENT_ID) routes to the
    # human gate, never crashes. Any local pick falls through to sourcing_agent.
    - branch_on_route:
        switch:
          # Coordinator self-escalated: skip remote A2A, let the existing gate
          # / HITL path handle it (local sourcing still runs as the safe default).
          - condition: ${coordinator_response.body.chosenAgentId == "__escalate__"}
            next: patch_stage_sourcing
          # Remote / A2A route: chosen id names the tiktok-mcp node.
          - condition: ${text.match_regex(coordinator_response.body.chosenAgentId, "^tiktok-mcp")}
            next: patch_stage_sourcing_remote
          # Default: local in-process sourcing — unchanged legacy behavior.
          - condition: true
            next: patch_stage_sourcing

    # Remote A2A sourcing path (D45). Mirrors the local patch_stage_sourcing
    # bookkeeping so downstream stages see identical campaign state, then does
    # the cross-component A2A v0.3 message:send hop.
    - patch_stage_sourcing_remote:
        call: http.post
        args:
          url: ${sys.get_env("CAMPAIGN_REPO_URL") + "/patch-stage"}
          body:
            campaignId: ${campaignId}
            stage: "sourcing"
            state: "running"
          auth:
            type: OIDC
        next: a2a_invoke_remote

    # D45: THE cross-component edge. The workflow A2A-invokes the OSS
    # tiktok-mcp-server's `plan_creator_search` intent (A2A-INTENTS.md §2.1)
    # over A2A v0.3 `message:send`. Body mirrors a2a_invoke._build_a2a_message
    # exactly: {"message":{"role":"user","messageId":<corr>,"parts":[{"kind":"text","text":<brief>}]}}.
    - a2a_invoke_remote:
        call: http.post
        args:
          # D42: remote endpoint resolved via args.agent_urls OR AGENT_URL_TIKTOK_MCP
          # env-var fallback; "/v1/message:send" appended (A2A v0.3 REST binding).
          # No hardcoded https:// literal.
          url: ${default(map.get(args.agent_urls, "tiktok-mcp-search"), sys.get_env("AGENT_URL_TIKTOK_MCP")) + "/v1/message:send"}
          body:
            message:
              role: "user"
              # Correlation id derived from campaignId (echoed back for trace pairing).
              messageId: ${"a2a-" + campaignId + "-sourcing"}
              parts:
                - kind: "text"
                  text: ${"Source creators for brand campaign " + campaignId + " — targeting " + json.encode(brief.targeting)}
          headers:
            Content-Type: "application/json"
            A2A-Version: "0.3"
          auth:
            type: OIDC
          timeout: 60
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 3
          backoff: {initial_delay: 2, max_delay: 30, multiplier: 2}
        result: a2a_response

    # Parse the A2A v0.3 `task` envelope (A2A-INTENTS.md §2.1 / a2a_invoke
    # ._extract_response_payload). On status.state == "completed", lift the
    # first artifacts[].parts[].data (RankedCreators) into the SAME `candidates`
    # variable the existing vetting_fanout consumes — so the rest of the workflow
    # is unchanged. Any other state raises so the existing error path handles it.
    - check_a2a_outcome:
        switch:
          - condition: ${a2a_response.body.status.state == "completed"}
            steps:
              - assign_remote_candidates:
                  assign:
                    # RankedCreators.creators[] is the candidate list. The first
                    # data artifact part carries the structured result.
                    - candidates: ${a2a_response.body.artifacts[0].parts[0].data.creators}
              - jump_to_vetting:
                  next: vetting_fanout
          - condition: true
            raise: ${"a2a_sourcing_failed:" + default(a2a_response.body.status.state, "unknown_state")}

    - patch_stage_sourcing:
        call: http.post
        args:
          url: ${sys.get_env("CAMPAIGN_REPO_URL") + "/patch-stage"}
          body:
            campaignId: ${campaignId}
            stage: "sourcing"
            state: "running"
          auth:
            type: OIDC

    - sourcing_agent:
        call: http.post
        args:
          url: ${default(map.get(args.agent_urls, "sourcing"), sys.get_env("AGENT_URL_SOURCING"))}
          body:
            brief: ${brief}
            campaignId: ${campaignId}
            campaignBudgetUsd: ${policy.budgets.maxUsdPerCampaign}
            excludeCreatorIds: []
          auth:
            type: OIDC
          timeout: 1500
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 3
          backoff: {initial_delay: 5, max_delay: 120, multiplier: 2}
        result: sourcing_response

    - check_sourcing_outcome:
        switch:
          - condition: ${sourcing_response.body.kind != "ok"}
            raise: ${"sourcing_escalated:" + sourcing_response.body.reason}
    - assign_candidates:
        assign:
          - candidates: ${sourcing_response.body.value.candidates}

    - vetting_fanout:
        parallel:
          shared: [vetted]
          for:
            value: candidate
            in: ${candidates}
            steps:
              - call_vetting:
                  try:
                    call: http.post
                    args:
                      url: ${default(map.get(args.agent_urls, "vetting"), sys.get_env("AGENT_URL_VETTING"))}
                      body:
                        brief: ${brief}
                        candidate: ${candidate}
                        campaignId: ${campaignId}
                      auth:
                        type: OIDC
                      timeout: 900
                    result: vet_response
                  retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff: {initial_delay: 2, max_delay: 60, multiplier: 2}
              - keep_if_ok:
                  switch:
                    - condition: ${vet_response.body.kind == "ok"}
                      steps:
                        - push_vetted:
                            assign:
                              - vetted: ${list.concat(vetted, [vet_response.body.value])}

    - pick_shortlist:
        call: http.post
        args:
          url: ${sys.get_env("PICK_SHORTLIST_URL") + "/pick"}
          body:
            vetted: ${vetted}
            targetCount: ${brief.targeting.creatorCount}
          auth:
            type: OIDC
        result: shortlist_response
    - assign_shortlist:
        assign:
          - shortlist: ${shortlist_response.body}

    - gate_approve_shortlist:
        call: gate
        args:
          campaignId: ${campaignId}
          workspaceId: ${workspaceId}
          kind: "shortlist"
          recommendation: ${shortlist}
          rationale: ${"Vetted: " + string(len(vetted)) + ". Shortlist: " + string(len(shortlist)) + "."}
          gateConfig: ${policy.gates.approveShortlist}
        result: gate_result

    - branch_on_gate:
        switch:
          - condition: ${gate_result.decision == "rejected"}
            return:
              campaignId: ${campaignId}
              stage: "sourcing"
              decision: "rejected"
              trackCount: 0
          - condition: true
            assign:
              - confirmed: ${gate_result.payload}

    - persist_tracks:
        for:
          value: c
          in: ${confirmed}
          steps:
            - upsert_track:
                call: http.post
                args:
                  url: ${sys.get_env("CAMPAIGN_REPO_URL") + "/upsert-track"}
                  body:
                    campaignId: ${campaignId}
                    creatorId: ${c.creator.id}
                    stage: "sourcing"
                    state: "shortlisted"
                  auth:
                    type: OIDC

    - advance_stage_outreach:
        call: http.post
        args:
          url: ${sys.get_env("CAMPAIGN_REPO_URL") + "/patch-stage"}
          body:
            campaignId: ${campaignId}
            stage: "outreach"
          auth:
            type: OIDC

    - resolve_creator_emails:
        call: http.post
        args:
          url: ${sys.get_env("CREATOR_DIRECTORY_URL") + "/resolve-emails"}
          body:
            creatorIds: ${list.map(confirmed, "creator.id")}
          auth:
            type: OIDC
        result: email_lookup_response
    - assign_email_lookup:
        assign:
          - emailLookup: ${email_lookup_response.body}

    - fanout_creator_tracks:
        for:
          value: c
          in: ${confirmed}
          steps:
            - publish_creator_track_start:
                call: googleapis.pubsub.v1.projects.topics.publish
                args:
                  topic: ${"projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/topics/creator-track.fanout"}
                  body:
                    messages:
                      - data: ${base64.encode(json.encode({"campaignId": campaignId, "brief": brief, "creator": c.creator, "creatorEmail": map.get(emailLookup, c.creator.id, ""), "recentPosts": []}))}
                        attributes:
                          campaignId: ${campaignId}
                          creatorId: ${c.creator.id}
                          v2EventType: "creator-track.start"

    - return_result:
        return:
          campaignId: ${campaignId}
          stage: "outreach"
          shortlistCount: ${len(shortlist)}
          trackCount: ${len(confirmed)}
          decision: ${gate_result.decision}
