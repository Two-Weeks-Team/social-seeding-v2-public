# gmail-watch-renew.workflows.yaml
# Trigger: Cloud Scheduler cron `0 4 * * 1` (Mon 04:00 UTC).
# Source pattern: INNGEST-MIGRATION.md §3.5 (cron port).
#
# Gmail's watch() registration expires every 7 days. We renew weekly so a
# missed run (or a workflow restart) still has a safety buffer before
# replies stop arriving. The campaign-repo service does the actual
# users.watch() call against each connected mailbox.

main:
  params: [args]
  steps:
    - init:
        assign:
          - triggeredBy: ${default(args.triggeredBy, "manual")}

    - list_active_mailboxes:
        call: http.post
        args:
          url: ${sys.get_env("CAMPAIGN_REPO_URL") + "/gmail/list-watched"}
          body: {}
          auth:
            type: OIDC
        result: mailboxes_response

    - renew_each:
        for:
          value: mailbox
          in: ${mailboxes_response.body.mailboxes}
          steps:
            - renew_one:
                try:
                  call: http.post
                  args:
                    url: ${sys.get_env("CAMPAIGN_REPO_URL") + "/gmail/renew-watch"}
                    body:
                      mailboxId: ${mailbox.id}
                      userEmail: ${mailbox.userEmail}
                    auth:
                      type: OIDC
                    timeout: 60
                  result: renew_response
                except:
                  as: e
                  steps:
                    - publish_watch_expire_warn:
                        call: googleapis.pubsub.v1.projects.topics.publish
                        args:
                          topic: ${"projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/topics/gmail.watch.expire"}
                          body:
                            messages:
                              - data: ${base64.encode(json.encode({"mailboxId": mailbox.id, "userEmail": mailbox.userEmail, "error": e.message}))}
                                attributes:
                                  mailboxId: ${mailbox.id}
                                  severity: "warn"

    - return_summary:
        return:
          triggeredBy: ${triggeredBy}
          renewedCount: ${len(mailboxes_response.body.mailboxes)}
