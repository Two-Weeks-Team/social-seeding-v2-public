name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from package.json `packageManager` field (pnpm@10.18.2)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify-build   # turbo: lint + type-check + build, all packages
      # - run: pnpm run test          # enable once packages/agents has tests
      # - run: pnpm run test:eval     # golden-set evals for the agents (Phase 1+)
