name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from package.json `packageManager` field (pnpm@10.18.2)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify-build   # turbo: lint + type-check + build, all packages

  # TS unit + component suites (vitest). Was ungated for months (the old
  # `pnpm run test` line was commented out), which let red `@ss/web` AP2
  # component tests slip in. Now gated. The Mongo-backed packages
  # (capabilities/workflows/agents) read MONGODB_URI from an in-process
  # mongodb-memory-server; `@ss/web` is JSDOM-only. Each Mongo-backed package
  # runs against its OWN database name (MONGODB_DB) — they share one mongod and
  # would otherwise cross-contaminate each other's collections.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start in-memory MongoDB (mongodb-memory-server :27027)
        run: |
          pnpm run dev-mongo > /tmp/dev-mongo.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "mongod ready" /tmp/dev-mongo.log; then echo "mongo ready"; break; fi
            sleep 1
          done
          grep -q "mongod ready" /tmp/dev-mongo.log || { echo "::error::mongo failed to start"; cat /tmp/dev-mongo.log; exit 1; }
      - name: vitest @ss/web (JSDOM, no Mongo)
        run: pnpm --filter @ss/web test
      - name: vitest @ss/observability
        env:
          MONGODB_URI: mongodb://127.0.0.1:27027/social_seeding
          MONGODB_DB: ss_test_observability
        run: pnpm --filter @ss/observability test
      - name: vitest @ss/capabilities
        env:
          MONGODB_URI: mongodb://127.0.0.1:27027/social_seeding
          MONGODB_DB: ss_test_capabilities
        run: pnpm --filter @ss/capabilities test
      - name: vitest @ss/workflows
        env:
          MONGODB_URI: mongodb://127.0.0.1:27027/social_seeding
          MONGODB_DB: ss_test_workflows
        run: pnpm --filter @ss/workflows test
      - name: vitest @ss/agents
        env:
          MONGODB_URI: mongodb://127.0.0.1:27027/social_seeding
          MONGODB_DB: ss_test_agents
        run: pnpm --filter @ss/agents test

  # Python agent suite (packages/agents-adk). Runs in parallel with `verify`.
  # Offline by design: tests/conftest.py forces SS_OFFLINE=1 / SS_LIVE=0 (autouse),
  # so no GCP creds are needed. Authority: DECISIONS.md D37 (TDD gate), D7 (timeline).
  pytest-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pyproject requires-python = ">=3.12,<3.13"
      - uses: astral-sh/setup-uv@v3
      - name: Install agents-adk (dev extra)
        working-directory: packages/agents-adk
        run: uv pip install --system -e ".[dev]"
      - name: pytest (offline)
        working-directory: packages/agents-adk
        run: pytest -q
      # H5 (GRAND-NARRATIVE-PLAN.md §5-1): offline golden-eval gate. Drives the
      # coordinator's deterministic predictor against its .evalset.json with a
      # train/dev/holdout split; exits non-zero if the HOLDOUT slice misses the
      # floor (overfit / regression). Fully offline ($0, no Vertex/creds) — the
      # live Vertex Agent Evaluation path stays a nightly/operator job.
      # Authority: D25 (Agent-Evaluation rung), D37 (Layer-1 TDD gate), D5.
      - name: golden-eval gate (offline, coordinator)
        working-directory: packages/agents-adk
        env:
          SS_OFFLINE: "1"
          SS_LIVE: "0"
        run: python -m evals --agent coordinator --holdout-floor 0.7
