name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from package.json `packageManager` field (pnpm@10.18.2)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify-build   # turbo: lint + type-check + build, all packages
      # - run: pnpm run test          # enable once packages/agents has tests

  # Python agent suite (packages/agents-adk). Runs in parallel with `verify`.
  # Offline by design: tests/conftest.py forces SS_OFFLINE=1 / SS_LIVE=0 (autouse),
  # so no GCP creds are needed. Authority: DECISIONS.md D37 (TDD gate), D7 (timeline).
  pytest-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pyproject requires-python = ">=3.12,<3.13"
      - uses: astral-sh/setup-uv@v3
      - name: Install agents-adk (dev extra)
        working-directory: packages/agents-adk
        run: uv pip install --system -e ".[dev]"
      - name: pytest (offline)
        working-directory: packages/agents-adk
        run: pytest -q
      # TODO(H5): wire golden-eval gate once packages/agents-adk eval runner lands
      #   (was `pnpm run test:eval` — golden-set evals for the agents, Phase 1+).
