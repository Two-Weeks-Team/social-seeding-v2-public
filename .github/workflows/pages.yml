name: Build & Deploy to GitHub Pages

# Publishes site/ (landing page + interactive demo + progress report) to
# https://two-weeks-team.github.io/social-seeding-v2/
#
# The build step keeps site/demo/ and site/report/ in sync with their canonical
# sources so the source-of-truth files (scripts/demo/web-demo/index.html and
# gcp-research/reports/social-seeding-status-2026-05-19.html) remain the only
# place to edit. site/ itself stays committed so previews work without the
# workflow running.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/demo/web-demo/index.html"
      - "gcp-research/reports/social-seeding-status-2026-05-19.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync source-of-truth files into site/
        run: |
          set -euo pipefail
          mkdir -p site/demo site/report
          cp scripts/demo/web-demo/index.html site/demo/index.html
          cp gcp-research/reports/social-seeding-status-2026-05-19.html site/report/index.html
          touch site/.nojekyll
          echo "--- site/ tree ---"
          find site/ -type f -maxdepth 3 | sort
          echo "--- byte counts ---"
          wc -c site/index.html site/demo/index.html site/report/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
